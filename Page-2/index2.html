<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forecast</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
</head>

<body>
    <div class="nav">
        <nav>
            <h1 class="center">
                ENTER THE CITY NAME TO GET IT'S REAL-TIME FORECAST DATA
            </h1>
            <input type="text" id="city-input" class="search" placeholder="NAME OF THE CITY" autocomplete="off">
        </nav>
    </div>
    <div class="table">
        <table>
            <tr id="first">
                <th style="width: 50%; font-weight: bolder; font-size:10 px;">CONDITION</th>
                <th id="condition"></th>
            </tr>
            <tr id="second">
                <td>CELSIUS TEMPERATURE</td>
                <td id="temp"></td>
            </tr>
            <tr id="third">
                <td>WIND</td>
                <td id="wind"></td>
            </tr>
            <tr id="fourth">
                <td>WIND-DIRECTION</td>
                <td id="direction"></td>
            </tr>
            <tr id="fifth">
                <td>HUMIDITY</td>
                <td id="humidity"> </td>
            </tr>
            <tr id="sixth">
                <td>CLOUD</td>
                <td id="cloud"> </td>
            </tr>
        </table>
    </div>
    </div>

    <script src="app2.js"></script>
</body>

</html>
