<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forecast</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
</head>

<body>
    <div class="nav">
        <nav>
            <h1 class="center">
                ENTER THE CITY NAME TO GET IT'S REAL-TIME FORECAST DATA
            </h1>
            <input type="text" id="city-input" class="search" placeholder="NAME OF THE CITY" autocomplete="off">
            <button type="button" class=" button">SEARCH</button> 
        </nav>
        </div>
        <div class="table">
             <table>
                <tr id="first">
                    <th style="width: 50%; font-weight: bolder;"">CONDITION</th>
                    <th id="condition"></th>
                </tr>
                <tr id="second">
                    <td>CELSIUS TEMPERATURE</td>
                    <td id="temp"></td>
                </tr>
                <tr id="third">
                    <td>WIND</td>
                    <td id="wind"></td>
                </tr>
                <tr id="fourth">
                    <td>WIND-DIRECTION</td>
                    <td id="direction"></td>
                </tr>
                <tr id="fifth">
                    <td>HUMIDITY</td>
                    <td id="humidity"> </td>
                </tr>
                <tr id="sixth">
                    <td>CLOUD</td>
                    <td id="cloud"> </td>
                </tr>
            </table>
        </div>
    </div>

    <script src="app2.js"></script>
</body>

</html>
